sonar.projectKey=VerlandeRyan_Trame_api
sonar.projectName=Trame API
sonar.organization=verlanderyan

# Chemins relatifs à api/ (le rapport lcov de Vitest est relatif à ce dossier).
# Tests colocalisés dans src/ : fichiers *.test.ts et support src/testing/.
sonar.sources=src
sonar.exclusions=src/**/*.test.ts,src/testing/**
sonar.tests=src
sonar.test.inclusions=src/**/*.test.ts
sonar.javascript.lcov.reportPaths=coverage/lcov.info
# Amorçage du processus, exclu aussi de la couverture Vitest.
sonar.coverage.exclusions=src/server.ts,src/server.e2e.ts,src/bootstrap.ts
sonar.sourceEncoding=UTF-8
