# Hooks locaux — voir docs/conventions-projet.md §4.
# Lint et format (ESLint/Prettier) seront ajoutés au pre-commit avec le code.
pre-commit:
  commands:
    secrets:
      run: gitleaks git --pre-commit --staged --redact
    lint-web:
      root: web/
      glob: "*.{ts,vue,mjs}"
      run: npx --no-install eslint {staged_files}
    lint-api:
      root: api/
      glob: "src/**/*.ts"
      run: npx --no-install eslint {staged_files}
    lint-e2e:
      root: e2e/
      glob: "*.ts"
      run: npx --no-install eslint {staged_files}

commit-msg:
  commands:
    format:
      run: npx --no-install commitlint --edit {1}
    branche:
      run: sh scripts/check-branch.sh
