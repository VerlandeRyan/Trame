# Environnement de développement local.
# Le service web sera ajouté quand son dossier existera.
# Configuration : copier .env.example en .env (ignoré par git).
services:
  db:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB manquant, voir .env.example}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER manquant, voir .env.example}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD manquant, voir .env.example}
    ports:
      # Exposé uniquement sur la machine locale.
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - trame-db:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      # API_DB (facultatif) : autre base du même serveur, par exemple un catalogue personnel.
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${API_DB:-${POSTGRES_DB}}
      PORT: "3000"
    ports:
      # Exposé uniquement sur la machine locale.
      - "127.0.0.1:${API_PORT:-3000}:3000"

volumes:
  trame-db:
