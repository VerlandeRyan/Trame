# Environnement de développement local.
# Configuration : copier .env.example en .env (ignoré par git).
services:
  db:
    image: postgres:18@sha256:3a4264520e121176619f54ff867d12774bc81e95e7b84db58d63bccdb6144b81
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB manquant, voir .env.example}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER manquant, voir .env.example}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD manquant, voir .env.example}
    ports:
      # Exposé uniquement sur la machine locale.
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - trame-db:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      PORT: "3000"
      # Connexion Google et session : valeurs lues dans .env, toutes facultatives en local.
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-}
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:3001}
      SESSION_SECRET: ${SESSION_SECRET:-}
      SECURE_COOKIES: ${SECURE_COOKIES:-false}
      # 1 : le site Nuxt relaie les appels et transmet l'adresse du visiteur (X-Forwarded-For).
      TRUST_PROXY: ${TRUST_PROXY:-1}
      # Active la documentation interactive /docs (désactivée en production).
      NODE_ENV: development
    ports:
      # Exposé uniquement sur la machine locale.
      - "127.0.0.1:${API_PORT:-3000}:3000"

  web:
    build: ./web
    restart: unless-stopped
    depends_on:
      - api
    environment:
      NUXT_API_BASE: http://api:3000
      # Galerie de composants (/components) visible en local ; désactivée par défaut ailleurs.
      NUXT_PUBLIC_COMPONENT_GALLERY: "true"
    ports:
      # Exposé uniquement sur la machine locale.
      - "127.0.0.1:${WEB_PORT:-3001}:3000"

volumes:
  trame-db:
