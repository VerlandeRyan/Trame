sonar.projectKey=VerlandeRyan_Trame_web
sonar.projectName=Trame Web
sonar.organization=verlanderyan

# Chemins relatifs à web/ (le rapport lcov de Vitest est relatif à ce dossier).
sonar.sources=app
sonar.exclusions=**/*.spec.ts
sonar.tests=app
sonar.test.inclusions=**/*.spec.ts
sonar.javascript.lcov.reportPaths=coverage/lcov.info
# Adaptateur Nuxt sans logique, exclu aussi de la couverture Vitest.
sonar.coverage.exclusions=app/composables/useApi.ts
sonar.sourceEncoding=UTF-8

# Combobox / listbox ARIA (modèle W3C) : <select> et <datalist> ne permettent pas de styler le menu.
sonar.issue.ignore.multicriteria=a1,a2,a3,b1,b2,b3,c1,d1
sonar.issue.ignore.multicriteria.a1.ruleKey=Web:S6819
sonar.issue.ignore.multicriteria.a1.resourceKey=app/components/layout/SearchBox.vue
sonar.issue.ignore.multicriteria.a2.ruleKey=Web:S6842
sonar.issue.ignore.multicriteria.a2.resourceKey=app/components/layout/SearchBox.vue
sonar.issue.ignore.multicriteria.b1.ruleKey=Web:S6819
sonar.issue.ignore.multicriteria.b1.resourceKey=app/components/ui/Select.vue
sonar.issue.ignore.multicriteria.b2.ruleKey=Web:S6842
sonar.issue.ignore.multicriteria.b2.resourceKey=app/components/ui/Select.vue

# Clic souris seul sur ces éléments : le clavier passe par le champ ou le bouton (aria-activedescendant,
# flèches, Entrée) et par Échap pour la modale (clic sur le voile = équivalent de Échap).
sonar.issue.ignore.multicriteria.a3.ruleKey=Web:MouseEventWithoutKeyboardEquivalentCheck
sonar.issue.ignore.multicriteria.a3.resourceKey=app/components/layout/SearchBox.vue
sonar.issue.ignore.multicriteria.b3.ruleKey=Web:MouseEventWithoutKeyboardEquivalentCheck
sonar.issue.ignore.multicriteria.b3.resourceKey=app/components/ui/Select.vue
sonar.issue.ignore.multicriteria.c1.ruleKey=Web:MouseEventWithoutKeyboardEquivalentCheck
sonar.issue.ignore.multicriteria.c1.resourceKey=app/components/ui/Modal.vue

# Mixins Sass : le `&` n'a de parent qu'à l'inclusion (« Missing scoping root » : faux positif).
sonar.issue.ignore.multicriteria.d1.ruleKey=css:*
sonar.issue.ignore.multicriteria.d1.resourceKey=app/assets/styles/_mixins.scss
