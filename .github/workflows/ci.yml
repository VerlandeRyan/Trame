name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  # renovate: datasource=github-releases depName=gitleaks/gitleaks extractVersion=^v(?<version>.+)$
  GITLEAKS_VERSION: 8.30.1
  # renovate: datasource=docker depName=semgrep/semgrep
  SEMGREP_VERSION: 1.180.0
  SEMGREP_IMAGE_DIGEST: sha256:529ee8a277ec8adc5b534d7c74eea0a47e9de21d62852b6ba7ac6ba9566845c3

jobs:
  secrets:
    name: Secrets (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - name: Installer gitleaks (binaire officiel, somme de contrôle vérifiée)
        run: |
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSLO "${base}/${archive}"
          curl -fsSLO "${base}/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep " ${archive}\$" "gitleaks_${GITLEAKS_VERSION}_checksums.txt" | sha256sum -c -
          tar -xzf "${archive}" gitleaks
      - name: Analyser l'historique
        run: ./gitleaks git --redact --verbose

  semgrep:
    name: Analyse statique (Semgrep)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Analyser api/, web/ et e2e/ (image épinglée par digest)
        run: >-
          docker run --rm -v "$PWD:/src" -w /src
          "semgrep/semgrep@${SEMGREP_IMAGE_DIGEST}"
          semgrep scan
          --config p/typescript --config p/nodejs
          --metrics off --error --quiet api/src web/app e2e/tests

  commits:
    name: Messages de commit (commitlint)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx --no-install commitlint --from "${{ github.event.pull_request.base.sha }}" --to "${{ github.event.pull_request.head.sha }}" --verbose

  web:
    name: Web (types, lint, build et E2E)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          # Historique complet : Sonar compare la PR à `main` et attribue les issues.
          fetch-depth: 0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            e2e/package-lock.json
      - run: npm ci --ignore-scripts
        working-directory: web
      - run: npx nuxt prepare
        working-directory: web
      - run: npm run typecheck
        working-directory: web
      - run: npm run lint
        working-directory: web
      - run: npm run format:check
        working-directory: web
      - run: npm run test:coverage
        working-directory: web
      - name: Secret Sonar disponible ?
        id: sonar-token
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: echo "present=$([ -n "$SONAR_TOKEN" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - name: Analyse Sonar de web/ (ignorée sans SONAR_TOKEN, ex. PR de fork)
        if: steps.sonar-token.outputs.present == 'true'
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
        with:
          projectBaseDir: web
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      - run: npm run build
        working-directory: web
      - run: npm ci --ignore-scripts
        working-directory: e2e
      - run: npx playwright install --with-deps chromium webkit
        working-directory: e2e
      - run: npm test
        working-directory: e2e

  api:
    name: API (migrations et tests)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: trame
          POSTGRES_USER: trame
          POSTGRES_PASSWORD: ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U trame -d trame"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://trame:ci-only@localhost:5432/trame
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: api/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm run migrate:test
      - run: npm run test:coverage
      - name: Secret Sonar disponible ?
        id: sonar-token
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: echo "present=$([ -n "$SONAR_TOKEN" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - name: Analyse Sonar (ignorée sans SONAR_TOKEN, ex. PR de fork)
        if: steps.sonar-token.outputs.present == 'true'
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
        with:
          projectBaseDir: api
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
